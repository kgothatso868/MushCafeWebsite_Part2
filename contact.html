
<form id="contactForm" class="enquiry-form" action="mailto:info@mushcafe.com" method="post" enctype="text/plain">

    <label for="contactName">Full Name</label>
    <input type="text" id="contactName" name="Name" required>

    <label for="contactPhone">Phone Number</label>
    <input type="tel" id="contactPhone" name="Phone" required>

    <label for="contactEmail">Email Address</label>
    <input type="email" id="contactEmail" name="Email" required>

    <label for="messageType">Message Type</label>
    <select id="messageType" name="Message Type" required>
        <option value="">Select a message type</option>
        <option value="General Enquiry">General Enquiry</option>
        <option value="Order">Order</option>
        <option value="Feedback">Feedback</option>
        <option value="Other">Other</option>
    </select>

    <label for="contactMessage">Your Message</label>
    <textarea id="contactMessage" name="Message" rows="5" required></textarea>

    <button type="submit" class="button primary-button">Send Message</button>

    <div id="contactFormStatus" class="form-status" aria-live="polite"></div>

</form>
